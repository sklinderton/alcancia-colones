<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Alcancía</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alcancía">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <dialog id="dialogo-retiro" aria-labelledby="titulo-retiro">
    <form method="dialog" id="formulario-retiro">
      <h2 id="titulo-retiro">¿Qué vas a sacar?</h2>
      <p class="ayuda">Se registra el retiro y la alcancía se abre unos segundos para que lo saques.</p>
      <div id="lista-retiro"></div>
      <p id="error-retiro" class="error" role="alert"></p>
      <div class="acciones">
        <button type="button" class="secundario" id="cancelar-retiro">Cancelar</button>
        <button type="submit" id="confirmar-retiro">Retirar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-meta" aria-labelledby="titulo-meta">
    <form method="dialog" id="formulario-meta">
      <h2 id="titulo-meta">Cambiar la meta</h2>
      <p class="ayuda">Puedes ponerla tan alta como quieras; el ahorro también puede pasarla.</p>
      <label>Meta en colones
        <input id="nueva-meta" type="number" min="1" step="1" inputmode="numeric" required>
      </label>
      <p id="error-meta" class="error" role="alert"></p>
      <div class="acciones">
        <button type="button" class="secundario" id="cancelar-meta">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="analisis.js"></script>
  <script src="app.js"></script>
</body>
</html>
