<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Alcancía</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <dialog id="dialogo-retiro" aria-labelledby="titulo-retiro">
    <form method="dialog" id="formulario-retiro">
      <h2 id="titulo-retiro">¿Cuánto sacaste?</h2>
      <p class="ayuda">Así el saldo sigue coincidiendo con lo que hay adentro.</p>
      <div id="lista-retiro"></div>
      <p id="error-retiro" class="error" role="alert"></p>
      <div class="acciones">
        <button type="button" class="secundario" id="cancelar-retiro">Cancelar</button>
        <button type="submit" id="confirmar-retiro">Registrar retiro</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="analisis.js"></script>
  <script src="app.js"></script>
</body>
</html>
